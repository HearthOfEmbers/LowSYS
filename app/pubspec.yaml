name: lowsys_app
description: "LowSYS - an interactive distillation column simulator for teaching."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  lowsys_engine:
    path: ../packages/lowsys_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/LICENSES/
  fonts:
    - family: Architects Daughter
      fonts:
        - asset: assets/fonts/ArchitectsDaughter-Regular.ttf
    - family: Share Tech Mono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
    - family: STIX Two Math
      fonts:
        - asset: assets/fonts/STIXTwoMath-Regular.ttf
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rajdhani-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-VF.ttf

    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-VF.ttf
        - asset: assets/fonts/SourceSerif4-Italic-VF.ttf
          style: italic
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/SourceSans3-VF.ttf
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-VF.ttf
    - family: IM Fell English
      fonts:
        - asset: assets/fonts/IMFeENrm28P.ttf
    - family: Courier Prime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
        - asset: assets/fonts/CourierPrime-Bold.ttf
          weight: 700
    - family: VT323
      fonts:
        - asset: assets/fonts/VT323-Regular.ttf
